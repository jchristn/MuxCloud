name: Tests

# Every push to every branch and every pull request runs every test project: the Touchstone console runner
# under both target frameworks, and the xUnit v3 and NUnit adapters, on Linux, Windows, and macOS.

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"

jobs:
  test:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up .NET (8.0 + 10.0)
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('src/**/*.csproj', 'src/**/Directory.*.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore src/MuxCloud.sln

      - name: Build
        run: dotnet build src/MuxCloud.sln --configuration Release --no-restore

      - name: Console runner (net8.0)
        run: dotnet run --project src/Test.Automated/Test.Automated.csproj --configuration Release --framework net8.0 --no-build -- --results results-net8.0.json

      - name: Console runner (net10.0)
        run: dotnet run --project src/Test.Automated/Test.Automated.csproj --configuration Release --framework net10.0 --no-build -- --results results-net10.0.json

      - name: xUnit v3
        run: dotnet test src/Test.Xunit3/Test.Xunit3.csproj --configuration Release --no-build

      - name: NUnit
        run: dotnet test src/Test.Nunit/Test.Nunit.csproj --configuration Release --no-build

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: touchstone-results-${{ matrix.os }}
          path: results-*.json
          if-no-files-found: ignore

  providers:
    name: Provider matrix (${{ matrix.provider }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - provider: Postgresql
            port: "5432"
            user: postgres
            password: postgres
          - provider: Mysql
            port: "3306"
            user: root
            password: root
          - provider: SqlServer
            port: "1433"
            user: sa
            password: "MuxCloud!Passw0rd"

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-retries 20
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
        ports: ["3306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -uroot -proot"
          --health-interval 5s
          --health-retries 30
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "MuxCloud!Passw0rd"
        ports: ["1433:1433"]

    env:
      MUXCLOUD_TEST_DB_HOST: 127.0.0.1
      MUXCLOUD_TEST_DB_PORT: ${{ matrix.port }}
      MUXCLOUD_TEST_DB_USER: ${{ matrix.user }}
      MUXCLOUD_TEST_DB_PASSWORD: ${{ matrix.password }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up .NET (8.0 + 10.0)
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Build
        run: dotnet build src/MuxCloud.sln --configuration Release

      - name: Wait for SQL Server
        if: matrix.provider == 'SqlServer'
        run: |
          for i in $(seq 1 60); do
            (echo > /dev/tcp/127.0.0.1/1433) >/dev/null 2>&1 && break
            sleep 2
          done
          sleep 10

      - name: Console runner against ${{ matrix.provider }}
        run: dotnet run --project src/Test.Automated/Test.Automated.csproj --configuration Release --framework net10.0 --no-build -- --provider ${{ matrix.provider }} --results results-${{ matrix.provider }}.json

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: touchstone-results-${{ matrix.provider }}
          path: results-*.json
          if-no-files-found: ignore
