# Mux Cloud: the server and PostgreSQL. The dashboard is built into the server image and served by the server on the
# same origin as the API, the machine tunnel, the relay, and the events socket. Cookies, the relayed machine dashboard
# iframe, and WebSocket Origin checks depend on that single origin, so there is no separate dashboard container.
#
# Secrets and deployment values come from the environment or a .env file next to this file:
#   MUXCLOUD_DB_PASSWORD              database password (required)
#   MUXCLOUD_AUTH_SIGNING_KEY         64+ random characters (required). Keep it stable: changing it signs everyone out
#                                     and makes every machine sign in again.
#   MUXCLOUD_ADMIN_PASSWORD           seed administrator password (first boot only)
#   MUXCLOUD_PUBLIC_URL               the public https URL, for example https://app.usemux.ai
#   MUXCLOUD_TRUST_FORWARDED_HEADERS  true behind a load balancer or reverse proxy that sets X-Forwarded-For/-Proto
#   MUXCLOUD_EMAIL_PROVIDER           File (default, writes to ./email-outbox) or Mailgun
#   MUXCLOUD_MAILGUN_API_KEY          Mailgun key when the provider is Mailgun
#   MUXCLOUD_EXPO_ACCESS_TOKEN        optional, for mobile push notifications
#   MUXCLOUD_PORT                     host port (default 8800)
# Profiles "mysql" and "sqlserver" start those engines instead; point MUXCLOUD_DB_TYPE and MUXCLOUD_DB_SERVER at them.

name: muxcloud

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: muxcloud
      POSTGRES_USER: muxcloud
      POSTGRES_PASSWORD: ${MUXCLOUD_DB_PASSWORD:?set MUXCLOUD_DB_PASSWORD}
    volumes:
      - muxcloud-postgres:/var/lib/postgresql/data
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U muxcloud -d muxcloud"]
      interval: 5s
      timeout: 5s
      retries: 2
      start_period: 20s

  mysql:
    image: mysql:8.4
    profiles: ["mysql"]
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: muxcloud
      MYSQL_USER: muxcloud
      MYSQL_PASSWORD: ${MUXCLOUD_DB_PASSWORD:?set MUXCLOUD_DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MUXCLOUD_DB_PASSWORD:?set MUXCLOUD_DB_PASSWORD}
    volumes:
      - muxcloud-mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 2
      start_period: 40s

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    profiles: ["sqlserver"]
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MUXCLOUD_DB_PASSWORD:?set MUXCLOUD_DB_PASSWORD}
    volumes:
      - muxcloud-sqlserver:/var/opt/mssql

  # Creates the bind-mounted folders and gives them to the server's non-root user (uid 1654 in the .NET image).
  muxcloud-init:
    image: busybox:1.37
    command: ["sh", "-c", "chown -R 1654:1654 /init/data /init/logs /init/email-outbox"]
    volumes:
      - ./data:/init/data
      - ./logs:/init/logs
      - ./email-outbox:/init/email-outbox

  muxcloud-server:
    build:
      context: ..
      dockerfile: docker/server/Dockerfile
    image: jchristn77/muxcloud-server:v0.1.0-alpha
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      muxcloud-init:
        condition: service_completed_successfully
    ports:
      - "${MUXCLOUD_PORT:-8800}:8800"
    environment:
      MUXCLOUD_SETTINGS_FILE: /app/muxcloud.json
      MUXCLOUD_DB_PASSWORD: ${MUXCLOUD_DB_PASSWORD:?set MUXCLOUD_DB_PASSWORD}
      MUXCLOUD_AUTH_SIGNING_KEY: ${MUXCLOUD_AUTH_SIGNING_KEY:?set MUXCLOUD_AUTH_SIGNING_KEY to 64+ random characters}
      MUXCLOUD_ADMIN_PASSWORD: ${MUXCLOUD_ADMIN_PASSWORD:-}
      MUXCLOUD_PUBLIC_URL: ${MUXCLOUD_PUBLIC_URL:-http://127.0.0.1:8800}
      MUXCLOUD_TRUST_FORWARDED_HEADERS: ${MUXCLOUD_TRUST_FORWARDED_HEADERS:-false}
      MUXCLOUD_EMAIL_PROVIDER: ${MUXCLOUD_EMAIL_PROVIDER:-File}
      MUXCLOUD_MAILGUN_API_KEY: ${MUXCLOUD_MAILGUN_API_KEY:-}
      MUXCLOUD_EXPO_ACCESS_TOKEN: ${MUXCLOUD_EXPO_ACCESS_TOKEN:-}
    volumes:
      - ./muxcloud.json:/app/muxcloud.json:ro
      - ./data:/app/data
      - ./logs:/app/logs
      - ./email-outbox:/app/email-outbox
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8800/v1.0/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  muxcloud-postgres:
  muxcloud-mysql:
  muxcloud-sqlserver:
